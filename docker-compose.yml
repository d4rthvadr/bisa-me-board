services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qna_board}
      POSTGRES_USER: ${DB_USER:-qna_board}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qna_board}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qna_board} -d ${DB_NAME:-qna_board}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
