{% extends 'board/base.html' %}

{% block title %}Sign up | QnA Board{% endblock %}

{% block content %}
  <section class="mx-auto max-w-md">
    <div class="card border border-base-300 bg-base-100 shadow-sm">
      <div class="card-body">
        <h1 class="card-title text-xl">Create owner account</h1>
        <form method="post" class="grid gap-4">
          {% csrf_token %}
          <div class="grid gap-2">{{ form.as_p }}</div>
          <button class="btn btn-primary" type="submit">Sign up</button>
        </form>
        <p class="text-sm text-base-content/70">Already have an account? <a class="link link-primary" href="{% url 'board:sign_in' %}">Sign in</a></p>
      </div>
    </div>
  </section>
{% endblock %}
