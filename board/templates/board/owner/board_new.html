{% extends 'board/base.html' %}

{% block title %}New Board | QnA Board{% endblock %}

{% block content %}
  <section class="mx-auto max-w-xl">
    <div class="card rounded-[1.8rem] border border-base-300 bg-base-100">
      <div class="card-body p-6">
        <h1 class="card-title text-xl">Create a board</h1>
        <p class="text-sm text-base-content/70">Start a new live Q&amp;A space with a simple shareable code.</p>

        <form method="post" class="grid gap-4">
          {% csrf_token %}
          <label class="form-control w-full">
            <div class="label"><span class="label-text">Board title</span></div>
            <input
              class="input input-bordered w-full {% if title_error %}input-error{% endif %}"
              id="title"
              name="title"
              maxlength="100"
              required
              value="{{ title_value }}"
            />
            {% if title_error %}
              <div class="mt-1 text-sm font-medium text-error">
                Board title is required.
              </div>
            {% endif %}
          </label>

          <div class="card-actions justify-end">
            <a class="btn btn-ghost" href="{% url 'board:owner_boards' %}">Cancel</a>
            <button class="btn btn-primary" type="submit">Create</button>
          </div>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
