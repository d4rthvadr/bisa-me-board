{% extends 'board/base.html' %}

{% block title %}QnA Board{% endblock %}

{% block content %}
  <section class="mb-6">
    <div class="card border border-base-300 bg-base-100 shadow-sm">
      <div class="card-body">
        <h1 class="card-title text-2xl">Public Boards</h1>
        <p class="text-sm text-base-content/70">Join a board instantly using its public link.</p>
      </div>
    </div>
  </section>

  <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    {% for board in boards %}
      <a class="card border border-base-300 bg-base-100 shadow-sm transition hover:-translate-y-0.5 hover:shadow" href="{% url 'board:home' board.code %}">
        <div class="card-body gap-2">
          <h2 class="card-title text-lg">{{ board.title }}</h2>
          <p class="text-sm text-base-content/70">/b/{{ board.code }}/</p>
        </div>
      </a>
    {% empty %}
      <div class="col-span-full">
        <div class="alert border border-base-300 bg-base-100">
          <span>No public boards yet.</span>
        </div>
      </div>
    {% endfor %}
  </section>
{% endblock %}
