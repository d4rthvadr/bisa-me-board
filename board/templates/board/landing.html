<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QnA Board</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 1rem;
        background: #f0f2f5;
        color: #1a1a1a;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
      }

      .board-list {
        display: grid;
        gap: 0.75rem;
      }

      .board-card {
        display: block;
        padding: 1rem;
        border-radius: 12px;
        background: #fff;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 1px 3px rgba(0,0,0,.08);
      }

      .hint {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>QnA Board</h1>
      <p class="hint">Available public boards</p>
      <div class="board-list">
        {% for board in boards %}
          <a class="board-card" href="{% url 'board:home' board.code %}">
            <strong>{{ board.title }}</strong><br />
            <span>/b/{{ board.code }}/</span>
          </a>
        {% empty %}
          <p class="hint">No public boards yet.</p>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
