<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Error | QnA Board</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="grid min-h-screen place-items-center bg-base-200 p-4">
    <main
      class="card w-full max-w-lg border border-base-300 bg-base-100 shadow-sm"

      <div class="card-body items-start gap-4">
        <div class="badge badge-warning badge-outline">500</div>
        <h1 class="text-2xl font-semibold">Something went wrong</h1>

        <div class="card-actions">
          <a class="btn btn-primary" href="/">Go to homepage</a>

      </div>
